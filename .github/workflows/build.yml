# Builds Muzi Tame on a Mac on every push, checks it with pluginval,
# and offers the finished VST3 / AU / Standalone as a download (Actions tab > latest run > Artifacts).
name: Build macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build (Xcode project generated by Projucer, Release, Universal)
        run: |
          xcodebuild -project "Builds/MacOSX/Muzi Tame.xcodeproj" \
                     -target "Muzi Tame - All" -configuration Release \
                     ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY="-" -quiet build

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests \
            --validate "Builds/MacOSX/build/Release/Muzi Tame.vst3"

      - name: Package
        run: |
          mkdir -p dist
          cp -R "Builds/MacOSX/build/Release/Muzi Tame.vst3" "Builds/MacOSX/build/Release/Muzi Tame.component" "Builds/MacOSX/build/Release/Muzi Tame.app" dist/
          cp README.md "Muzi Tame Manual.pdf" dist/ || true
          cat > dist/INSTALL.txt <<'TXT'
          1. Copy "Muzi Tame.vst3" to ~/Library/Audio/Plug-Ins/VST3/
          2. Copy "Muzi Tame.component" to ~/Library/Audio/Plug-Ins/Components/
          3. These builds are not signed with an Apple developer certificate, so run once in Terminal:
             xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/"Muzi Tame.vst3" ~/Library/Audio/Plug-Ins/Components/"Muzi Tame.component"
          4. Rescan plugins in your DAW.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: MuziTame-macOS
          path: dist
          retention-days: 30
